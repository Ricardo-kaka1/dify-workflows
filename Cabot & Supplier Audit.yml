    - data:
        code: "import requests\nimport csv\nimport io\nimport re\nfrom collections\
          \ import defaultdict\n\ndef normalize_invoice_number(inv):\n    if not inv\
          \ or str(inv).strip().lower() in ['nan', 'none', '']:\n        return \"\
          UNKNOWN\"\n    inv_str = str(inv).strip().upper()\n    inv_str = re.sub(r'[^A-Z0-9]',\
          \ '', inv_str)\n    inv_str = inv_str.lstrip('0')\n    return inv_str if\
          \ inv_str else \"UNKNOWN\"\n\n# ⚠️ 这里是关键修改：参数名必须与 Dify 左侧的输入变量名完全一致\ndef\
          \ main(supplier_url: str, cabot_url: str):\n    \n    if not supplier_url\
          \ or not cabot_url:\n        return {\"error\": \"未检测到文件URL输入，请检查节点变量配置\"\
          }\n\n    try:\n        sup_response = requests.get(supplier_url)\n     \
          \   cabot_response = requests.get(cabot_url)\n        # 强制使用 utf-8 或 utf-8-sig\
          \ 解码 CSV 文本\n        sup_text = sup_response.content.decode('utf-8-sig')\n\
          \        cabot_text = cabot_response.content.decode('utf-8-sig')\n     \
          \   \n        sup_reader = csv.DictReader(io.StringIO(sup_text))\n     \
          \   cabot_reader = csv.DictReader(io.StringIO(cabot_text))\n        \n \
          \       supplier_data = list(sup_reader)\n        cabot_data = list(cabot_reader)\n\
          \    except Exception as e:\n        return {\"error\": f\"文件读取失败，请确保上传的是CSV格式:\
          \ {str(e)}\"}\n\n    findings = []\n    \n    # 1. 预处理与建立索引\n    sup_dict\
          \ = {}\n    net_supplier = defaultdict(float)\n    \n    for row in supplier_data:\n\
          \        sup_code = row.get('Supplier Code', '').strip()\n        inv_no\
          \ = row.get('Supplier Invoice No.', '')\n        norm_inv = normalize_invoice_number(inv_no)\n\
          \        try:\n            gross_amt = float(row.get('Invoice Gross Amount',\
          \ 0))\n        except ValueError:\n            gross_amt = 0.0\n       \
          \     \n        key = f\"{sup_code}_{norm_inv}\"\n        row['norm_invoice']\
          \ = norm_inv\n        row['parsed_gross'] = gross_amt\n        sup_dict[key]\
          \ = row\n        net_supplier[sup_code] += gross_amt\n\n    cabot_dict =\
          \ {}\n    net_cabot = defaultdict(float)\n    \n    for row in cabot_data:\n\
          \        sup_code = row.get('supplier_code', '').strip()\n        inv_no\
          \ = row.get('invoice_no', '')\n        norm_inv = normalize_invoice_number(inv_no)\n\
          \        try:\n            cab_amt = float(row.get('cabot_amount', 0))\n\
          \        except ValueError:\n            cab_amt = 0.0\n            \n \
          \       key = f\"{sup_code}_{norm_inv}\"\n        row['norm_invoice'] =\
          \ norm_inv\n        row['parsed_cabot_amt'] = cab_amt\n        cabot_dict[key]\
          \ = row\n        net_cabot[sup_code] += cab_amt\n\n    # =================\
          \ 宏观比对 =================\n    all_suppliers = set(net_supplier.keys()).union(set(net_cabot.keys()))\n\
          \    for sup_code in all_suppliers:\n        if not sup_code: continue\n\
          \        sup_total = round(net_supplier.get(sup_code, 0.0), 2)\n       \
          \ cab_total = round(net_cabot.get(sup_code, 0.0), 2)\n        \n       \
          \ if sup_total != cab_total:\n            findings.append({\n          \
          \      'check_name': 'Net Position Reconciliation', 'check_result': 'Net\
          \ payable mismatch',\n                'supplier_id': sup_code, 'invoice_id':\
          \ 'ALL', 'payment_reference': '', 'currency': 'Mixed',\n               \
          \ 'impacted_value': abs(sup_total - cab_total), 'impacted_document': 'Supplier\
          \ Statement', \n                'issue_severity': 'Financial', 'comment':\
          \ 'Aggregate supplier balance vs Cabot mismatch'\n            })\n\n   \
          \ # ================= 微观比对 =================\n    all_keys = set(sup_dict.keys()).union(set(cabot_dict.keys()))\n\
          \    \n    for key in all_keys:\n        if not key or key == \"_UNKNOWN\"\
          : continue\n        \n        s_row = sup_dict.get(key, {})\n        c_row\
          \ = cabot_dict.get(key, {})\n        \n        sup_code = key.split('_')[0]\n\
          \        inv_no = s_row.get('Supplier Invoice No.') if s_row else c_row.get('invoice_no')\n\
          \        currency = s_row.get('Invoice Currency', 'Unknown') if s_row else\
          \ 'Unknown'\n        pay_ref = s_row.get('payment_reference', '') if s_row\
          \ else ''\n        sup_comment = s_row.get('Supplier Comments', '') if s_row\
          \ else ''\n        \n        sup_amt = s_row.get('parsed_gross')\n     \
          \   cab_amt = c_row.get('parsed_cabot_amt')\n        \n        # 规则 1\n\
          \        if cab_amt is None:\n            findings.append({\n          \
          \      'check_name': 'Supplier vs Cabot Invoice Presence', 'check_result':\
          \ 'Unsubmitted Invoice',\n                'supplier_id': sup_code, 'invoice_id':\
          \ inv_no, 'payment_reference': pay_ref, 'currency': currency,\n        \
          \        'impacted_value': sup_amt, 'impacted_document': 'Invoice', 'issue_severity':\
          \ 'Control', 'comment': sup_comment\n            })\n            continue\
          \ \n            \n        # 规则 2\n        if sup_amt is None:\n        \
          \    findings.append({\n                'check_name': 'Cabot vs Supplier\
          \ Invoice Presence', 'check_result': 'Unsupported Invoice',\n          \
          \      'supplier_id': sup_code, 'invoice_id': inv_no, 'payment_reference':\
          \ pay_ref, 'currency': currency,\n                'impacted_value': cab_amt,\
          \ 'impacted_document': 'Invoice', 'issue_severity': 'Control', 'comment':\
          \ sup_comment\n            })\n            continue\n\n        # 规则 3\n\
          \        if round(sup_amt, 2) != round(cab_amt, 2):\n            findings.append({\n\
          \                'check_name': 'Amount Consistency', 'check_result': 'Invoice\
          \ value difference',\n                'supplier_id': sup_code, 'invoice_id':\
          \ inv_no, 'payment_reference': pay_ref, 'currency': currency,\n        \
          \        'impacted_value': abs(sup_amt - cab_amt), 'impacted_document':\
          \ 'Invoice', 'issue_severity': 'Financial', 'comment': sup_comment\n   \
          \         })\n\n    # 分组构建宏观数组\n    grouped_macro = {}\n    for f in findings:\n\
          \        grouped_macro.setdefault(f['supplier_id'], []).append(f)\n    \n\
          \    macro_findings = [{\"supplier_id\": k, \"findings_summary\": str(v)}\
          \ for k, v in grouped_macro.items()]\n\n    return {\n        \"micro_findings\"\
          : findings,\n        \"macro_findings\": macro_findings\n    }"
        code_language: python3
        outputs:
          macro_findings:
            children: null
            type: array[object]
          micro_findings:
            children: null
            type: array[object]
