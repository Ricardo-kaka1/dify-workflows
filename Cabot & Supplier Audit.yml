    - data:
        code: "import uuid\nimport csv\nimport io\n\n# 强制将 4 个输入变量作为参数传入\ndef main(micro_findings:\
          \ list, macro_findings: list, ai_macro_insights: list, ai_micro_insights:\
          \ list):\n    \n    # 确保传入的值不是 None\n    micro_findings = micro_findings\
          \ or []\n    macro_findings = macro_findings or []\n    ai_macro_insights\
          \ = ai_macro_insights or []\n    ai_micro_insights = ai_micro_insights or\
          \ []\n    \n    # 2. 构建宏观画像的映射字典\n    macro_dict = {}\n    for i, macro_data\
          \ in enumerate(macro_findings):\n        if i < len(ai_macro_insights):\n\
          \            insight = str(ai_macro_insights[i]).replace('\\n', ' ').strip()\n\
          \        else:\n            insight = \"暂无宏观分析\"\n        \n        sup_id\
          \ = macro_data.get('supplier_id', 'UNKNOWN')\n        macro_dict[sup_id]\
          \ = insight\n\n    # 3. 准备 CSV 写入器 (使用 io.StringIO 在内存中生成字符串)\n    output\
          \ = io.StringIO()\n    writer = csv.writer(output)\n    \n    # 如果没发现任何异常，返回一个简单的\
          \ CSV 提示\n    if not micro_findings:\n        writer.writerow([\"状态\", \"\
          详情\"])\n        writer.writerow([\"✅ 成功\", \"未发现任何账单差异，账目完全一致！\"])\n   \
          \     return {\"final_report\": output.getvalue()}\n\n    # 写入表头 (去掉了 emoji，防止部分旧版\
          \ Excel 识别异常，你也可以加上)\n    headers = [\"发现ID\", \"供应商ID\", \"发票号\", \"差异金额\"\
          , \"触发规则\", \"AI 单条诊断建议(微观)\", \"供应商系统风险评估(宏观)\"]\n    writer.writerow(headers)\n\
          \n    # 4. 逐行拼装微观明细并写入 CSV\n    for i, finding in enumerate(micro_findings):\n\
          \        finding_id = f\"FND-{str(uuid.uuid4())[:6].upper()}\"\n       \
          \ sup_id = str(finding.get('supplier_id', 'N/A'))\n        inv_id = str(finding.get('invoice_id',\
          \ 'N/A'))\n        diff_val = str(finding.get('impacted_value', '0'))\n\
          \        rule = str(finding.get('check_name', 'N/A'))\n        \n      \
          \  # 提取微观 AI 诊断\n        if i < len(ai_micro_insights):\n            micro_insight\
